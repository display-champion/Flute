<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔法陣の玉とビーム</title>
<style>
  :root {
    --bg: #f4f1ea;
    --sky-top: #e8e6ef;
    --sky-bottom: #f7f4ee;
    --ink: #1c1a17;
    --grid: 60, 52, 40;
    --accent: #c2410c;
    --panel: rgba(255, 255, 255, 0.86);
    --panel-border: rgba(0, 0, 0, 0.1);
    --muted: #6b645a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0f12;
      --sky-top: #09090c;
      --sky-bottom: #17161a;
      --ink: #f2efe9;
      --grid: 210, 200, 185;
      --accent: #fb923c;
      --panel: rgba(28, 27, 26, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --muted: #a39d93;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f0f12;
    --sky-top: #09090c;
    --sky-bottom: #17161a;
    --ink: #f2efe9;
    --grid: 210, 200, 185;
    --accent: #fb923c;
    --panel: rgba(28, 27, 26, 0.88);
    --panel-border: rgba(255, 255, 255, 0.12);
    --muted: #a39d93;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .side {
    position: fixed; top: 12px; left: 12px; width: min(300px, calc(100vw - 24px)); max-height: calc(100vh - 110px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 12px; font-size: 13px; backdrop-filter: blur(8px);
  }
  .side h1 { font-size: 15px; margin: 0 0 8px; }
  .side h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }
  .side p { margin: 6px 0; line-height: 1.5; }
  .muted { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--panel-border); border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .panel {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(720px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 10px 14px;
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; backdrop-filter: blur(8px); font-size: 13px;
  }
  .group { display: flex; gap: 6px; align-items: center; }
  label { color: var(--muted); white-space: nowrap; }
  input[type="range"] { width: 110px; accent-color: var(--accent); }
  .event { position: fixed; top: 16px; right: 16px; font-size: 14px; font-weight: 600; color: var(--accent); opacity: 0; transition: opacity 0.4s; pointer-events: none; }
  .event.show { opacity: 1; transition: none; }
  .timeline { position: fixed; right: 16px; top: 44px; font-size: 12px; color: var(--muted); text-align: right; pointer-events: none; }
  @media (max-width: 640px) { .side { max-height: 40vh; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="side">
  <h1>魔法陣の玉とビーム</h1>
  <h2>属性</h2>
  <div class="row" id="elements"></div>
  <h2>撃ち方</h2>
  <div class="row" id="clips"></div>
  <p class="muted" id="clipInfo"></p>
</div>
<div class="event" id="event"></div>
<div class="timeline" id="timeline"></div>
<div class="panel">
  <div class="group">
    <button id="play" class="on">一時停止</button>
    <button id="all">全部を連続</button>
  </div>
  <div class="group">
    <button data-view="0">正面</button>
    <button data-view="35" class="on">斜め</button>
    <button data-view="90">側面</button>
  </div>
  <div class="group">
    <label for="speed">速度</label>
    <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1">
  </div>
</div>

<script>
(() => {
  // ==POSE-BEGIN== （ここから POSE-END までは Unity 書き出しでも共有: tools/export_unity.mjs）
  // 座標は Unity と同じ：+X 右、+Y 上、+Z 正面。原点は術者の足元。角度は度（Unity と同じ Z→X→Y の順）
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const sin = Math.sin, cos = Math.cos;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];

  let registerTimes = null;
  function K(keys) {
    if (registerTimes) for (const k of keys) registerTimes.push(k[0]);
    return (t) => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [t0, v0] = keys[i], [t1, v1, ease] = keys[i + 1];
        if (t <= t1) {
          const u = (t - t0) / (t1 - t0);
          const e = ease === "l" ? u : ease === "in" ? u * u * u : ease === "out" ? 1 - (1 - u) ** 3 : u * u * (3 - 2 * u);
          return v0 + (v1 - v0) * e;
        }
      }
      return keys[keys.length - 1][1];
    };
  }
  const env = (t, a, b) => (t <= a || t >= b ? 0 : sin(Math.PI * (t - a) / (b - a)) ** 2);
  const smooth01 = (t, a, b) => { const u = clamp((t - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };

  const ORBS = 8;                 // 玉の数（Orb_0 〜 Orb_7）
  const ORB_SIZE = 0.38;          // 玉の直径（m）
  // 魔法陣の置き場所
  const FRONT = { pos: [0, 1.3, 0.8], rot: [0, 0, 0] };     // 術者の前に立てる（正面 +Z へ撃つ）
  const GROUND = { pos: [0, 0.03, 3.0], rot: [-90, 0, 0] }; // 前方の地面に寝かせる（上へ噴き上げる）
  const SKY = { pos: [0, 6.0, 6.0], rot: [90, 0, 0] };      // 前方の頭上に寝かせる（下へ降らせる）

  // 魔法陣の面（XY）上の点を、置き場所に合わせて世界の位置へ
  const rotX = (v, d) => { const c = cos(d * DEG), s = sin(d * DEG); return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c]; };
  const rotY = (v, d) => { const c = cos(d * DEG), s = sin(d * DEG); return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c]; };
  const onCircle = (place, x, y, z = 0) => add(place.pos, rotY(rotX([x, y, z], place.rot[0]), place.rot[1]));

  const CLIPS = [];
  function clip(name, dur, events, build, note) {
    registerTimes = [0, dur];
    const sample = build();
    for (const [t] of events) registerTimes.push(t);
    const times = [...new Set(registerTimes)].filter((t) => t >= 0 && t <= dur).sort((a, b) => a - b);
    registerTimes = null;
    CLIPS.push({ name, dur, loop: false, events, times, sample, note });
  }

  // 魔法陣の現れ方・消え方と輪の回転（溜めで速くなる）
  function circleParts(place, t, { fadeFrom, fadeTo, charge = [0.4, 1.0], boost = 1 }) {
    const s = t < 0.5 ? K([[0, 0], [0.35, 1.15, "out"], [0.5, 1]])(t) : 1 - smooth01(t, fadeFrom, fadeTo);
    const b = smooth01(t, charge[0], charge[1]) * boost;
    const spin = (rate) => rate * t + rate * 1.5 * b * (t - charge[0]) * (t > charge[0] ? 1 : 0);
    return {
      circle: { pos: place.pos, rot: place.rot, scl: s },
      outer: spin(90), inner: -spin(150), runes: spin(45),
    };
  }
  const hidden = () => ({ pos: [0, 1.3, 0.8], scl: 0 });
  const noBeam = () => ({ pos: [0, 1.3, 0.8], rot: [0, 0, 0], w: 0, len: 0 });

  // 玉の出る・撃つ・着弾の区切りをキーの時刻に入れる（クリップを作るときに呼ぶ）
  function mark(spawnAt, fireAt, travel = 0.55) {
    if (!registerTimes) return;
    const imp = fireAt + travel;
    registerTimes.push(spawnAt, spawnAt + 0.3, fireAt - 0.15, fireAt, imp, imp + 0.04, imp + 0.06, imp + 0.14);
  }
  // 1発の玉：出る → 飛ぶ → 着弾（弾けて消える）
  function shot(t, { spawnAt, fireAt, from, to, travel = 0.55, size = ORB_SIZE, curve = null }) {
    if (t < spawnAt) return { pos: from(spawnAt), scl: 0 };
    // 撃つまでは脈打つ（撃つ直前に脈打ちを消して、撃った後の大きさとつなげる）
    if (t < fireAt) return { pos: from(t), scl: size * smooth01(t, spawnAt, spawnAt + 0.3) * (1 + 0.08 * sin(TAU * 4 * t) * (1 - smooth01(t, fireAt - 0.15, fireAt))) };
    const u = clamp((t - fireAt) / travel, 0, 1), e = u * u * (3 - 2 * u) * 0.35 + u * 0.65;   // 少し加速しながら飛ぶ
    const p0 = from(fireAt);
    let pos = curve ? curve(p0, e) : lerp(p0, to, e);
    const impact = fireAt + travel;
    const scl = t < impact ? size : size * (1 + 1.5 * smooth01(t, impact, impact + 0.06)) * (1 - smooth01(t, impact + 0.04, impact + 0.14));
    if (t >= impact) pos = curve ? curve(p0, 1) : to;
    return { pos, scl };
  }

  // ---------- 1. 玉を1発 ----------
  clip("Orb_Single", 2.0, [[0, "Appear"], [0.4, "Charge"], [0.9, "Fire:0"], [1.45, "Impact:0"], [1.9, "Vanish"]], () => {
    const core = K([[0, 0], [0.35, 0.25], [0.85, 0.7], [0.95, 0.2], [2.0, 0]]);
    mark(0.4, 0.9);
    return (t) => ({
      ...circleParts(FRONT, t, { fadeFrom: 1.3, fadeTo: 1.9, charge: [0.4, 0.9] }), core: core(t),
      orbs: Array.from({ length: ORBS }, (_, i) => i === 0
        ? shot(t, { spawnAt: 0.4, fireAt: 0.9, from: () => onCircle(FRONT, 0, 0, 0.1), to: onCircle(FRONT, 0, 0, 13.1) })
        : hidden()),
      beam: noBeam(),
    });
  }, "前に立つ魔法陣の中心に玉が生まれ、正面へ1発（約13m・0.55秒）");

  // ---------- 2. 3発を扇形に ----------
  clip("Orb_Triple", 2.6, [[0, "Appear"], [0.4, "Charge"], [1.0, "Fire:0"], [1.15, "Fire:1"], [1.3, "Fire:2"], [1.55, "Impact:0"], [1.7, "Impact:1"], [1.85, "Impact:2"], [2.5, "Vanish"]], () => {
    const core = K([[0, 0], [0.35, 0.25], [0.9, 0.5], [1.3, 0.3], [2.6, 0]]);
    for (let i = 0; i < 3; i++) mark(0.4 + i * 0.1, 1.0 + i * 0.15);
    return (t) => ({
      ...circleParts(FRONT, t, { fadeFrom: 2.0, fadeTo: 2.5 }), core: core(t),
      orbs: Array.from({ length: ORBS }, (_, i) => {
        if (i > 2) return hidden();
        const a0 = (90 + i * 120) * DEG;
        const from = (u) => { const a = a0 + 0.9 * Math.min(u, 1.0 + i * 0.15); return onCircle(FRONT, 0.55 * cos(a), 0.55 * sin(a), 0.05); };
        const yaw = [-12, 0, 12][i];
        const fireAt = 1.0 + i * 0.15;
        return shot(t, { spawnAt: 0.4 + i * 0.1, fireAt, from, to: add(from(fireAt), rotY([0, 0, 13], yaw)) });
      }),
      beam: noBeam(),
    });
  }, "輪の上に3つの玉が並び、順に扇形（左右12°）へ撃つ");

  // ---------- 3. 連射 ----------
  clip("Orb_Barrage", 3.2, [[0, "Appear"], [0.4, "Charge"],
    ...Array.from({ length: 8 }, (_, i) => [0.9 + i * 0.2, `Fire:${i}`]), ...Array.from({ length: 8 }, (_, i) => [1.4 + i * 0.2, `Impact:${i}`]), [3.15, "Vanish"]], () => {
    const core = K([[0, 0], [0.35, 0.25], [0.9, 0.45], [2.4, 0.45], [3.2, 0]]);
    for (let i = 0; i < 8; i++) mark(0.4 + i * 0.12, 0.9 + i * 0.2, 0.5);
    return (t) => ({
      ...circleParts(FRONT, t, { fadeFrom: 2.7, fadeTo: 3.15, charge: [0.4, 0.9] }), core: core(t),
      orbs: Array.from({ length: ORBS }, (_, i) => {
        const a = (90 + i * 45) * DEG;
        const from = () => onCircle(FRONT, 0.6 * cos(a), 0.6 * sin(a), 0.05);
        return shot(t, { spawnAt: 0.4 + i * 0.12, fireAt: 0.9 + i * 0.2, from, to: onCircle(FRONT, 0.15 * cos(a), 0.15 * sin(a), 12), travel: 0.5, size: ORB_SIZE * 0.75 });
      }),
      beam: noBeam(),
    });
  }, "輪の周り8か所から0.2秒おきに連射（少し中心へ寄りながら約12m）");

  // ---------- 4. 回ってから追尾 ----------
  clip("Orb_Homing", 3.2, [[0, "Appear"], [0.4, "Charge"], [1.4, "Fire"], ...Array.from({ length: 6 }, (_, i) => [2.2 + i * 0.05, `Impact:${i}`]), [3.0, "Vanish"]], () => {
    const core = K([[0, 0], [0.35, 0.25], [1.3, 0.6], [1.5, 0.2], [3.2, 0]]);
    const target = [0, 1.2, 12];
    for (let i = 0; i < 6; i++) mark(0.4 + i * 0.08, 1.4 + i * 0.05, 0.8);
    return (t) => ({
      ...circleParts(FRONT, t, { fadeFrom: 2.4, fadeTo: 3.0, charge: [0.4, 1.4] }), core: core(t),
      orbs: Array.from({ length: ORBS }, (_, i) => {
        if (i > 5) return hidden();
        const a0 = i * 60 * DEG;
        const orbit = (u) => { const a = a0 + 2.2 * Math.min(u, 1.4); return onCircle(FRONT, 0.95 * cos(a), 0.95 * sin(a), 0.1); };
        const fireAt = 1.4 + i * 0.05;
        // いったん外側へふくらんでから、目標の一点へ曲がって集まる
        const curve = (p0, e) => {
          const out = [p0[0] - FRONT.pos[0], p0[1] - FRONT.pos[1], 0];
          const p1 = add(p0, add(mul(out, 3), [0, 0, 3]));
          const a = lerp(p0, p1, e), b = lerp(p1, target, e);
          return lerp(a, b, e);
        };
        return shot(t, { spawnAt: 0.4 + i * 0.08, fireAt, from: orbit, to: target, travel: 0.8, curve, size: ORB_SIZE * 0.8 });
      }),
      beam: noBeam(),
    });
  }, "6つの玉が魔法陣の周りを回り、いっせいに外へふくらんでから前方12m の一点へ曲がって集まる");

  // ---------- 5. ビーム ----------
  function beamClip(name, dur, events, { yaw = () => 0, on = 1.0, off = 2.4, fade = [2.5, 2.9] }, note) {
    clip(name, dur, events, () => {
      const core = K([[0, 0], [0.35, 0.25], [on - 0.05, 0.8], [on + 0.1, 0.5], [off, 0.5], [off + 0.2, 0], [dur, 0]]);
      const len = K([[0, 0], [on, 0], [on + 0.15, 20, "out"], [dur, 20]]);
      const w = K([[0, 0], [on, 0], [on + 0.05, 0.9, "out"], [on + 0.2, 0.55], [off, 0.55], [off + 0.2, 0, "in"], [dur, 0]]);
      return (t) => {
        const y = yaw(t);
        const parts = circleParts({ pos: FRONT.pos, rot: [0, y * 0.6, 0] }, t, { fadeFrom: fade[0], fadeTo: fade[1], charge: [0.4, on] });
        return {
          ...parts, core: core(t),
          orbs: Array.from({ length: ORBS }, (_, i) => i === 0
            // 溜めの間だけ、中心に光が集まる（撃つと消える）
            ? { pos: onCircle(FRONT, 0, 0, 0.1), scl: 0.5 * smooth01(t, 0.4, on - 0.05) * (1 - smooth01(t, on - 0.05, on + 0.05)) }
            : hidden()),
          beam: { pos: onCircle(FRONT, 0, 0, 0.05), rot: [0, y, 0], w: w(t) * (1 + 0.08 * sin(TAU * 9 * t) * env(t, on + 0.2, off)), len: len(t) },
        };
      };
    }, note);
  }
  beamClip("Beam", 3.0, [[0, "Appear"], [0.4, "Charge"], [1.0, "BeamStart"], [2.4, "BeamEnd"], [2.9, "Vanish"]], {},
    "溜めてから、太さ0.55m・長さ20m のビームを1.4秒撃ち続ける");
  beamClip("Beam_Sweep", 3.6, [[0, "Appear"], [0.4, "Charge"], [1.0, "BeamStart"], [2.8, "BeamEnd"], [3.5, "Vanish"]],
    { yaw: K([[0, -40], [1.2, -40], [2.6, 40], [3.6, 40]]), on: 1.0, off: 2.8, fade: [2.9, 3.5] },
    "ビームを左40°から右40°へなぎ払う（魔法陣も少し向きを変える）");

  // ---------- 7. 足元から噴き上がる柱 ----------
  clip("Pillar", 2.6, [[0, "Appear"], [0.35, "Charge"], [1.0, "PillarStart"], [1.8, "PillarEnd"], [2.5, "Vanish"]], () => {
    const core = K([[0, 0], [0.3, 0.3], [0.95, 0.9], [1.1, 0.5], [1.8, 0.4], [2.0, 0]]);
    const len = K([[0, 0], [1.0, 0], [1.15, 7, "out"], [2.6, 7]]);
    const w = K([[0, 0], [1.0, 0], [1.05, 1.6, "out"], [1.2, 1.1], [1.8, 1.1], [2.0, 0, "in"], [2.6, 0]]);
    return (t) => ({
      ...circleParts(GROUND, t, { fadeFrom: 2.0, fadeTo: 2.5, charge: [0.35, 1.0], boost: 2 }), core: core(t),
      orbs: Array.from({ length: ORBS }, () => hidden()),
      beam: { pos: GROUND.pos, rot: [-90, 0, 0], w: w(t) * (1 + 0.1 * sin(TAU * 11 * t) * env(t, 1.2, 1.8)), len: len(t) },
    });
  }, "前方3m の地面に魔法陣が広がり、光の柱（高さ7m・太さ1.1m）が噴き上がる");

  // ---------- 8. 頭上から降り注ぐ ----------
  const RAIN = [[0.3, 0.2], [-0.7, 0.5], [0.8, -0.6], [-0.2, -0.9], [0.1, 1.0], [-0.9, -0.3], [0.9, 0.4], [-0.4, 0.2]];
  clip("Rain", 3.6, [[0, "Appear"], [0.4, "Charge"], ...RAIN.map((_, i) => [1.0 + i * 0.22, `Fire:${i}`]), ...RAIN.map((_, i) => [1.35 + i * 0.22, `Impact:${i}`]), [3.5, "Vanish"]], () => {
    const core = K([[0, 0], [0.35, 0.3], [1.0, 0.6], [2.6, 0.6], [3.6, 0]]);
    RAIN.forEach((_, i) => mark(0.6 + i * 0.1, 1.0 + i * 0.22, 0.35));
    return (t) => ({
      ...circleParts(SKY, t, { fadeFrom: 3.0, fadeTo: 3.5, charge: [0.4, 1.0] }), core: core(t),
      orbs: RAIN.map(([x, z], i) => shot(t, {
        spawnAt: 0.6 + i * 0.1, fireAt: 1.0 + i * 0.22,
        from: () => onCircle(SKY, x, z, 0.1), to: [x * 1.8, 0.15, SKY.pos[2] + z * 1.8], travel: 0.35,
      })),
      beam: noBeam(),
    });
  }, "前方6m・高さ6m に魔法陣が現れ、玉が0.22秒おきに8発降り注ぐ");

  // 属性（色は確認用と Unity の既定値。味付けは Unity の MagicCircleRig がする）
  const ELEMENTS = [
    { key: "Fire", name: "炎", main: "#f97316", core: "#fde68a", note: "玉がゆらめき、尾が赤く伸びる" },
    { key: "Ice", name: "氷", main: "#38bdf8", core: "#f0f9ff", note: "玉がとげのある結晶で回転する" },
    { key: "Thunder", name: "雷", main: "#facc15", core: "#fffbeb", note: "ビームと玉がちらつき、稲妻のように揺れる" },
    { key: "Wind", name: "風", main: "#4ade80", core: "#f0fdf4", note: "玉が渦を巻いて速く回る" },
    { key: "Water", name: "水", main: "#3b82f6", core: "#dbeafe", note: "玉がぷるぷると伸び縮みする" },
    { key: "Earth", name: "土", main: "#a16207", core: "#fde68a", note: "玉が岩のように転がる（光は控えめ）" },
    { key: "Light", name: "光", main: "#fde047", core: "#ffffff", note: "まぶしく、輪がきらめく" },
    { key: "Dark", name: "闇", main: "#7c3aed", core: "#1e1b4b", note: "中心が暗く、紫のふちが揺らぐ" },
  ];

  // Unity の各オブジェクトの動き（クリップのカーブになる値）
  //   Circle / Circle/RingOuter / Circle/RingInner / Circle/Runes / Circle/Core / Orb_0〜7 / Beam
  function evalFx(c, t) {
    const S = c.sample(clamp(t, 0, c.dur));
    const out = {
      "Circle": { pos: S.circle.pos, rot: S.circle.rot, scl: [S.circle.scl, S.circle.scl, S.circle.scl] },
      "Circle/RingOuter": { pos: [0, 0, 0], rot: [0, 0, S.outer], scl: [1, 1, 1] },
      "Circle/RingInner": { pos: [0, 0, 0], rot: [0, 0, S.inner], scl: [1, 1, 1] },
      "Circle/Runes": { pos: [0, 0, 0], rot: [0, 0, S.runes], scl: [1, 1, 1] },
      "Circle/Core": { pos: [0, 0, 0], rot: [0, 0, 0], scl: [S.core, S.core, S.core] },
      "Beam": { pos: S.beam.pos, rot: S.beam.rot, scl: [S.beam.w, S.beam.w, S.beam.len] },
    };
    S.orbs.forEach((o, i) => { out[`Orb_${i}`] = { pos: o.pos, rot: [0, 0, 0], scl: [o.scl, o.scl, o.scl] }; });
    return out;
  }
  // ==POSE-END==

  // ---------- 描画（確認用） ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(...a) || 1; return mul(a, 1 / l); };
  // Unity の Quaternion.Euler と同じ順（Z → X → Y）で回す
  const rotZ = (v, d) => { const c = cos(d * DEG), s = sin(d * DEG); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]]; };
  const euler = (v, r) => rotY(rotX(rotZ(v, r[2]), r[0]), r[1]);
  const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

  const state = { playing: true, speed: 1, clip: 0, element: 0, time: 0, chain: false, yaw: 35 * DEG, yawTarget: 35 * DEG, pitch: 0.18, bursts: [], trails: [] };
  let cam = null;
  function setupCamera() {
    const target = [0, 2.4, 5.5], dist = 16, cp = cos(state.pitch);
    const pos = add(target, [sin(state.yaw) * cp * dist, sin(state.pitch) * dist, cos(state.yaw) * cp * dist]);
    const F = norm(sub(target, pos)), R = norm(cross([0, 1, 0], F)), U = cross(F, R);
    cam = { pos, F, R, U, f: Math.min(W, H * 1.4) * 0.95, cx: W / 2 + Math.min(150, W * 0.12), cy: H * 0.55 };
  }
  const NEAR = 0.3;
  const toCam = (p) => { const q = sub(p, cam.pos); return [dot(q, cam.R), dot(q, cam.U), dot(q, cam.F)]; };
  const proj = (p) => { const c = toCam(p); return c[2] > NEAR ? { x: cam.cx + cam.f * c[0] / c[2], y: cam.cy - cam.f * c[1] / c[2], s: cam.f / c[2], z: c[2] } : null; };

  function drawGround() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, css("--sky-top")); g.addColorStop(1, css("--sky-bottom"));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const rgb = css("--grid");
    ctx.lineWidth = 1;
    const line = (a, b, al) => { const p = proj(a), q = proj(b); if (!p || !q) return; ctx.strokeStyle = `rgba(${rgb},${al})`; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); };
    for (let x = -20; x <= 20; x++) line([x, 0, -10], [x, 0, 30], x === 0 ? 0.2 : 0.08);
    for (let z = -10; z <= 30; z++) line([-20, 0, z], [20, 0, z], 0.08);
  }
  // 術者（大きさの目安）
  function drawCaster() {
    const ink = css("--ink");
    const J = { hip: [0, 0.95, 0], neck: [0, 1.55, 0.05], head: [0, 1.7, 0.07], lf: [-0.12, 0, 0.05], rf: [0.12, 0, -0.05],
      lh: [-0.18, 1.3, 0.45], rh: [0.18, 1.3, 0.45], ls: [-0.18, 1.5, 0.05], rs: [0.18, 1.5, 0.05] };
    ctx.strokeStyle = ink; ctx.lineCap = "round";
    const seg = (a, b, w) => { const p = proj(a), q = proj(b); if (!p || !q) return; ctx.lineWidth = Math.max(1, w * (p.s + q.s) / 2); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); };
    seg(J.lf, J.hip, 0.05); seg(J.rf, J.hip, 0.05); seg(J.hip, J.neck, 0.05); seg(J.ls, J.lh, 0.045); seg(J.rs, J.rh, 0.045); seg(J.ls, J.rs, 0.05);
    const h = proj(J.head); if (h) { ctx.fillStyle = ink; ctx.beginPath(); ctx.arc(h.x, h.y, 0.11 * h.s, 0, TAU); ctx.fill(); }
  }

  function glow(p3, r, main, core, alpha = 1) {
    const p = proj(p3); if (!p || r <= 0) return;
    const R = Math.max(2, r * p.s);
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R * 2.4);
    g.addColorStop(0, hexA(core, alpha)); g.addColorStop(0.3, hexA(main, 0.9 * alpha)); g.addColorStop(0.6, hexA(main, 0.3 * alpha)); g.addColorStop(1, hexA(main, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, R * 2.4, 0, TAU); ctx.fill();
  }

  function drawFx(c, t) {
    const E = ELEMENTS[state.element];
    const X = evalFx(c, t);
    const C = X.Circle;
    ctx.save();
    // 暗い配色のときは光を加算で重ねる
    ctx.globalCompositeOperation = window.matchMedia("(prefers-color-scheme: dark)").matches ? "lighter" : "source-over";
    // 魔法陣（輪・ルーン・六芒星）
    if (C.scl[0] > 0.01) {
      const toW = (v, spin) => add(C.pos, euler(mul(rotZ(v, spin), C.scl[0]), C.rot));
      const ring = (r, spin, width, alpha) => {
        ctx.strokeStyle = hexA(E.main, alpha); ctx.lineWidth = width;
        ctx.beginPath();
        for (let i = 0; i <= 64; i++) { const a = (i / 64) * TAU; const p = proj(toW([r * cos(a), r * sin(a), 0], spin)); if (!p) continue; i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
        ctx.stroke();
      };
      ctx.shadowColor = E.main; ctx.shadowBlur = 14;
      ring(1.0, X["Circle/RingOuter"].rot[2], 3, 0.9);
      ring(0.88, X["Circle/RingOuter"].rot[2], 1.5, 0.7);
      ring(0.55, X["Circle/RingInner"].rot[2], 2, 0.8);
      // 六芒星（内側の輪と一緒に回る）
      ctx.strokeStyle = hexA(E.main, 0.8); ctx.lineWidth = 1.5;
      for (const k of [0, 1]) {
        ctx.beginPath();
        for (let i = 0; i <= 3; i++) { const a = (k * 60 + i * 120 + 90) * DEG; const p = proj(toW([0.86 * cos(a), 0.86 * sin(a), 0], X["Circle/RingInner"].rot[2])); if (p) i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
        ctx.stroke();
      }
      // ルーン（外周の目盛り）
      ctx.lineWidth = 2;
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * TAU;
        const p = proj(toW([0.9 * cos(a), 0.9 * sin(a), 0], X["Circle/Runes"].rot[2])), q = proj(toW([(i % 3 ? 0.95 : 0.99) * cos(a), (i % 3 ? 0.95 : 0.99) * sin(a), 0], X["Circle/Runes"].rot[2]));
        if (p && q) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
      }
      ctx.shadowBlur = 0;
      glow(C.pos, 0.25 * X["Circle/Core"].scl[0] * C.scl[0] + 0.001, E.main, E.core, 0.9);
    }
    // ビーム（付け根が Beam の位置、+Z 方向へ長さ len）
    const B = X.Beam;
    if (B.scl[0] > 0.005 && B.scl[2] > 0.01) {
      const dir = euler([0, 0, 1], B.rot);
      // カメラより手前で線を切る（先端がカメラの後ろへ回っても描けるように）
      let ca = toCam(B.pos), cb = toCam(add(B.pos, mul(dir, B.scl[2])));
      if (cb[2] < NEAR && ca[2] >= NEAR) cb = add(ca, mul(sub(cb, ca), (NEAR - ca[2]) / (cb[2] - ca[2])));
      if (ca[2] < NEAR && cb[2] >= NEAR) ca = add(cb, mul(sub(ca, cb), (NEAR - cb[2]) / (ca[2] - cb[2])));
      const pc = (c) => (c[2] >= NEAR - 1e-6 ? { x: cam.cx + cam.f * c[0] / c[2], y: cam.cy - cam.f * c[1] / c[2], s: cam.f / c[2] } : null);
      const a = pc(ca), b = pc(cb);
      if (a && b) {
        const jitter = E.key === "Thunder" ? () => (Math.random() - 0.5) * 8 : () => 0;
        for (const [wk, col, al] of [[1.6, E.main, 0.25], [1.0, E.main, 0.7], [0.45, E.core, 1]]) {
          ctx.strokeStyle = hexA(col, al); ctx.lineCap = "round";
          ctx.lineWidth = Math.max(1, B.scl[0] * wk * (a.s + b.s) / 2);
          ctx.beginPath(); ctx.moveTo(a.x, a.y);
          for (let i = 1; i <= 8; i++) { const k = i / 8; ctx.lineTo(a.x + (b.x - a.x) * k + jitter(), a.y + (b.y - a.y) * k + jitter()); }
          ctx.stroke();
        }
      }
    }
    // 玉と尾
    for (let i = 0; i < ORBS; i++) {
      const O = X[`Orb_${i}`];
      const tr = state.trails[i] || (state.trails[i] = []);
      if (O.scl[0] > 0.01) { tr.push(O.pos); if (tr.length > 10) tr.shift(); } else tr.length = 0;
      tr.forEach((p, k) => glow(p, O.scl[0] * 0.5 * (k / tr.length), E.main, E.main, 0.35 * (k / tr.length)));
      let r = O.scl[0] / 2;
      if (E.key === "Fire") r *= 1 + 0.12 * sin(t * 40 + i);
      if (E.key === "Water") r *= 1 + 0.08 * sin(t * 18 + i);
      glow(O.pos, r, E.main, E.core);
      if (E.key === "Ice" && r > 0.02) {
        const p = proj(O.pos); if (p) { ctx.strokeStyle = hexA(E.core, 0.9); ctx.lineWidth = 1.5; for (let k = 0; k < 6; k++) { const a = k * TAU / 6 + t * 6; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + cos(a) * r * p.s * 1.6, p.y + sin(a) * r * p.s * 1.6); ctx.stroke(); } }
      }
    }
    // 着弾のはじけ
    for (const b of state.bursts) {
      const p = proj(b.p); if (!p) continue;
      const k = b.life / 0.45;
      ctx.strokeStyle = hexA(E.main, 1 - k); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, (0.2 + 1.2 * k) * p.s, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- UI ----------
  const elEl = document.getElementById("elements"), clipsEl = document.getElementById("clips"), infoEl = document.getElementById("clipInfo");
  const eventEl = document.getElementById("event"), timelineEl = document.getElementById("timeline");
  ELEMENTS.forEach((e, i) => {
    const b = document.createElement("button");
    b.innerHTML = `<span class="swatch" style="background:${e.main}"></span>${e.name}`;
    b.addEventListener("click", () => { state.element = i; elEl.querySelectorAll("button").forEach((x, k) => x.classList.toggle("on", k === i)); infoEl.textContent = describe(); });
    elEl.appendChild(b);
  });
  CLIPS.forEach((c, i) => {
    const b = document.createElement("button"); b.textContent = c.name;
    b.addEventListener("click", () => { state.chain = false; playClip(i); });
    clipsEl.appendChild(b);
  });
  const describe = () => { const c = CLIPS[state.clip], E = ELEMENTS[state.element]; return `${c.name}（${c.dur}秒）：${c.note}。${E.name}：${E.note}`; };
  function playClip(i) {
    state.clip = i; state.time = 0; state.bursts = []; state.trails = [];
    clipsEl.querySelectorAll("button").forEach((x, k) => x.classList.toggle("on", k === i));
    infoEl.textContent = describe();
  }
  elEl.firstChild.classList.add("on");
  let eventTimer = 0;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    let c = CLIPS[state.clip];
    const prev = state.time;
    if (state.playing) state.time += dt * state.speed;
    for (const [t, n] of c.events) if (prev < t && state.time >= t) {
      eventEl.textContent = `イベント：${n}`; eventEl.classList.add("show"); eventTimer = 0.5;
      if (n.startsWith("Impact")) { const i = +(n.split(":")[1] || 0); state.bursts.push({ p: evalFx(c, t)[`Orb_${i}`].pos, life: 0 }); }
    }
    for (const b of state.bursts) b.life += dt * state.speed;
    state.bursts = state.bursts.filter((b) => b.life < 0.45);
    if (state.time >= c.dur + 0.5) { playClip(state.chain ? (state.clip + 1) % CLIPS.length : state.clip); c = CLIPS[state.clip]; }
    let dy = state.yawTarget - state.yaw; dy = Math.atan2(sin(dy), cos(dy)); state.yaw += dy * Math.min(1, dt * 6);
    eventTimer -= dt; if (eventTimer <= 0) eventEl.classList.remove("show");
    const t = Math.min(state.time, c.dur);
    timelineEl.textContent = `${c.name}  ${t.toFixed(2)} / ${c.dur.toFixed(2)} 秒`;
    setupCamera(); drawGround(); drawCaster(); drawFx(c, t);
    requestAnimationFrame(frame);
  }
  const playBtn = document.getElementById("play");
  const togglePlay = () => { state.playing = !state.playing; playBtn.textContent = state.playing ? "一時停止" : "再生"; playBtn.classList.toggle("on", state.playing); };
  playBtn.addEventListener("click", togglePlay);
  window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); togglePlay(); } });
  document.getElementById("all").addEventListener("click", () => { state.chain = true; playClip(0); });
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    state.yawTarget = (+b.dataset.view) * DEG;
    document.querySelectorAll("[data-view]").forEach((x) => x.classList.toggle("on", x === b));
  }));
  document.getElementById("speed").addEventListener("input", (e) => { state.speed = +e.target.value; });
  let drag = null;
  canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, yaw: state.yawTarget, pitch: state.pitch }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    state.yawTarget = drag.yaw - (e.clientX - drag.x) * 0.008; state.yaw = state.yawTarget;
    state.pitch = clamp(drag.pitch + (e.clientY - drag.y) * 0.004, -0.2, 1.2);
    document.querySelectorAll("[data-view]").forEach((x) => x.classList.remove("on"));
  });
  canvas.addEventListener("pointerup", () => { drag = null; });
  canvas.addEventListener("pointercancel", () => { drag = null; });
  playClip(0);
  requestAnimationFrame(frame);
  window.__mc = { state, CLIPS, ELEMENTS, playClip, evalFx };
})();
</script>
</body>
</html>
