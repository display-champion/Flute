<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダンジョン雑魚モーション</title>
<style>
  :root {
    --bg: #f4f1ea;
    --sky-top: #e9e6de;
    --sky-bottom: #f7f4ee;
    --ink: #1c1a17;
    --grid: 60, 52, 40;
    --accent: #c2410c;
    --panel: rgba(255, 255, 255, 0.86);
    --panel-border: rgba(0, 0, 0, 0.1);
    --muted: #6b645a;
    --outline: rgba(28, 26, 23, 0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --sky-top: #0c0c0e;
      --sky-bottom: #1b1a19;
      --ink: #f2efe9;
      --grid: 210, 200, 185;
      --accent: #fb923c;
      --panel: rgba(28, 27, 26, 0.88);
      --panel-border: rgba(255, 255, 255, 0.12);
      --muted: #a39d93;
      --outline: rgba(242, 239, 233, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --sky-top: #0c0c0e;
    --sky-bottom: #1b1a19;
    --ink: #f2efe9;
    --grid: 210, 200, 185;
    --accent: #fb923c;
    --panel: rgba(28, 27, 26, 0.88);
    --panel-border: rgba(255, 255, 255, 0.12);
    --muted: #a39d93;
    --outline: rgba(242, 239, 233, 0.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden;
  }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .side {
    position: fixed;
    top: 12px;
    left: 12px;
    width: min(300px, calc(100vw - 24px));
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    backdrop-filter: blur(8px);
  }
  .side h1 { font-size: 15px; margin: 0 0 8px; }
  .side h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }
  .side p { margin: 6px 0; line-height: 1.5; }
  .muted { color: var(--muted); }
  select { font: inherit; width: 100%; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--panel-border); background: transparent; color: var(--ink); }
  select option { color: #1c1a17; }
  .clips { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .panel {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    width: min(720px, calc(100vw - 32px));
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    backdrop-filter: blur(8px);
    font-size: 13px;
  }
  .group { display: flex; gap: 6px; align-items: center; }
  label { color: var(--muted); white-space: nowrap; }
  input[type="range"] { width: 110px; accent-color: var(--accent); }
  .event {
    position: fixed;
    top: 16px;
    right: 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .event.show { opacity: 1; transition: none; }
  .timeline { position: fixed; right: 16px; top: 44px; font-size: 12px; color: var(--muted); text-align: right; pointer-events: none; }
  @media (max-width: 640px) {
    .side { max-height: 38vh; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="side">
  <h1>ダンジョン雑魚モーション</h1>
  <select id="enemy"></select>
  <p id="desc" class="muted"></p>
  <h2>クリップ</h2>
  <div class="clips" id="clips"></div>
  <p class="muted" id="clipInfo"></p>
</div>
<div class="event" id="event"></div>
<div class="timeline" id="timeline"></div>

<div class="panel">
  <div class="group">
    <button id="play" class="on">一時停止</button>
    <button id="all">全クリップ連続</button>
  </div>
  <div class="group">
    <button data-view="0">正面</button>
    <button data-view="35" class="on">斜め</button>
    <button data-view="90">側面</button>
  </div>
  <div class="group">
    <label for="speed">速度</label>
    <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1">
  </div>
</div>

<script>
(() => {
  // ==POSE-BEGIN== （ここから POSE-END までは Unity 書き出しでも共有: tools/export_unity.mjs）
  // 座標は Unity と同じ：+X 右、+Y 上、+Z 正面。回転はオイラー角（度、Unity と同じ Z→X→Y の順）
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const sin = Math.sin, cos = Math.cos;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // キー補間。keys = [[時刻(秒), 値, 補間], ...]。補間は "s" なめらか（既定）/ "l" 直線 / "in" 加速 / "out" 減速
  let registerTimes = null;
  function K(keys) {
    if (registerTimes) for (const k of keys) registerTimes.push(k[0]);
    return (t) => {
      if (t <= keys[0][0]) return keys[0][1];
      for (let i = 0; i < keys.length - 1; i++) {
        const [t0, v0] = keys[i], [t1, v1, ease] = keys[i + 1];
        if (t <= t1) {
          const u = (t - t0) / (t1 - t0);
          const e = ease === "l" ? u : ease === "in" ? u * u * u : ease === "out" ? 1 - (1 - u) ** 3 : u * u * (3 - 2 * u);
          return v0 + (v1 - v0) * e;
        }
      }
      return keys[keys.length - 1][1];
    };
  }
  // 区間 [a, b] で 0→1→0 と立ち上がって消える重み（揺れや震えを一部の区間だけにかける）
  const env = (t, a, b) => (t <= a || t >= b ? 0 : sin(Math.PI * (t - a) / (b - a)) ** 2);
  const volume = (sy) => 1 / Math.sqrt(sy);   // 縦に縮んだら横に膨らむ（体積をだいたい保つ）

  // 体の種類。pivot = 回転・伸び縮みの中心（モデルの足元を原点とした位置）
  const BODIES = {
    Mushroom: { name: "キノコ", pivot: [0, 0, 0], note: "足元が原点。キノコ CHR-013 をそのまま Motion の子に置く" },
    Bee: { name: "ハチ", pivot: [0, 1.0, 0], note: "胴体の中心が高さ 1.0m に来るよう置く（その高さでホバリング）" },
    Fairy: { name: "光の妖精", pivot: [0, 1.2, 0], note: "光の玉の中心が高さ 1.2m に来るよう置く" },
    RockBall: { name: "岩ダンゴ", pivot: [0, 0.3, 0], note: "足元が原点。丸まったときの球の中心が高さ 0.3m（0.6倍のクリーチャーを想定）" },
    Slug: { name: "ナメクジ", pivot: [0, 0.06, -0.3], note: "足元が原点、頭が +Z。しっぽの付け根（後ろ 0.3m）を軸に伸び縮みする" },
    Creature: { name: "四つ足の獣", pivot: [0, 0.35, 0], note: "足元が原点。ファンタジークリーチャー CHR-011（体の中心が高さ 0.35m 前後）" },
    Plant: { name: "植物", pivot: [0, 0, 0], note: "根元が原点。植物クリーチャー CHR-016" },
    Flyer: { name: "翼の悪魔", pivot: [0, 1.6, 0], note: "胴体の中心が高さ 1.6m に来るよう置く（翼の悪魔 CHR-023）" },
    Spider: { name: "蜘蛛", pivot: [0, 0.2, 0], note: "足元が原点。体の中心が高さ 0.2m" },
    Clockwork: { name: "時計仕掛け", pivot: [0, 0.45, 0], note: "足元が原点。スチームパンク時計クリーチャー CHR-015（体の中心が高さ 0.45m）" },
    Whale: { name: "小型のクジラ", pivot: [0, 0.3, 0], note: "水面（または底）が原点。サイバークジラ CHR-009 を 0.5 倍で" },
    Barrel: { name: "樽", pivot: [0, 0.4, 0], note: "足元が原点。高さ 0.8m・半径 0.3m の樽" },
    Box: { name: "木箱", pivot: [0, 0, -0.3], note: "足元が原点。箱の後ろ下の角（後ろ 0.3m）を軸に傾く" },
    Shears: { name: "浮かぶ鋏", pivot: [0, 1.1, 0], note: "鋏の留め具が高さ 1.1m に来るよう置く。刃先が +Z" },
  };

  const CLIPS = [];
  // clip(体, 名前, 長さ秒, ループ, イベント[[秒, 名前]], 作る関数, 確認用の移動)
  function clip(body, name, dur, loop, events, build, travel) {
    registerTimes = [0, dur];
    const sample = build();
    for (const [t] of events) registerTimes.push(t);
    const times = [...new Set(registerTimes)].filter((t) => t >= 0 && t <= dur).sort((a, b) => a - b);
    registerTimes = null;
    CLIPS.push({ body, name, dur, loop, events, times, sample, travel: travel || null });
  }
  // 各サンプラーは { pos:[x,y,z], rot:[x,y,z](度), scl:[x,y,z] } を返す（省略した項目は動かない）

  // ---------- キノコ（EN-01 胞子キノコ / EN-04 輪の茸番 / EN-16 洞窟茸 / EN-43 苔キノコ） ----------
  clip("Mushroom", "Idle", 2.0, true, [], () => (t) => {
    const w = sin(TAU * t / 2);
    return { rot: [0, 0, 3 * sin(TAU * t / 2 + 0.5)], scl: [1 - 0.02 * w, 1 + 0.04 * w, 1 - 0.02 * w] };
  });
  clip("Mushroom", "Move", 0.6, true, [], () => (t) => {
    // ぴょこぴょこ跳ねて進む（1歩 0.6 秒）
    const u = t / 0.6, air = sin(Math.PI * u), squash = 0.18 * ((cos(TAU * u) + 1) / 2) ** 6;
    const sy = 1 - squash + 0.1 * air * air;
    return { pos: [0, 0.14 * air, 0], rot: [6 * sin(TAU * u), 0, 0], scl: [volume(sy), sy, volume(sy)] };
  });
  clip("Mushroom", "Attack_Lunge", 1.4, false, [[0.68, "Hit"]], () => {
    // 縮んで溜める → 0.9m 飛びかかる → 着地 → 跳ねて元の位置へ
    const z = K([[0, 0], [0.45, 0], [0.7, 0.9, "out"], [1.0, 0.9], [1.4, 0]]);
    const y = K([[0, 0], [0.45, 0], [0.57, 0.35, "out"], [0.7, 0, "in"], [1.0, 0], [1.2, 0.15, "out"], [1.4, 0, "in"]]);
    const rx = K([[0, 0], [0.45, -14], [0.6, 22], [0.72, 28], [1.0, 10], [1.4, 0]]);
    const sy = K([[0, 1], [0.4, 0.72], [0.45, 0.72], [0.55, 1.22], [0.68, 1.1], [0.72, 0.8], [0.85, 1.02], [1.0, 1], [1.25, 1.05], [1.4, 1]]);
    return (t) => ({ pos: [0, y(t), z(t)], rot: [rx(t), 0, 0], scl: [volume(sy(t)), sy(t), volume(sy(t))] });
  });
  clip("Mushroom", "Attack_Stomp", 2.2, false, [[1.0, "Stomp"], [1.9, "Recover"]], () => {
    // 跳び上がって踏みつけ（半径1.6m）→ 0.9 秒つぶれたまま動けない → 起き上がる
    const y = K([[0, 0], [0.35, 0], [0.75, 0.6, "out"], [1.0, 0, "in"], [2.2, 0]]);
    const sy = K([[0, 1], [0.3, 0.75], [0.4, 0.75], [0.55, 1.25], [0.75, 1.1], [0.95, 1.15], [1.02, 0.6], [1.15, 0.72], [1.9, 0.72], [2.05, 1.08], [2.2, 1]]);
    const rx = K([[0, 0], [0.35, -6], [0.75, 4], [1.0, 8], [1.9, 8], [2.2, 0]]);
    return (t) => ({ pos: [0, y(t), 0], rot: [rx(t), 0, 1.5 * sin(TAU * 9 * t) * env(t, 1.1, 1.9)], scl: [volume(sy(t)), sy(t), volume(sy(t))] });
  });
  clip("Mushroom", "Hit", 0.45, false, [], () => {
    const rx = K([[0, 0], [0.08, -18, "out"], [0.45, 0]]);
    const z = K([[0, 0], [0.08, -0.08, "out"], [0.45, 0]]);
    const sy = K([[0, 1], [0.06, 0.82], [0.2, 1.06], [0.45, 1]]);
    return (t) => ({ pos: [0, 0, z(t)], rot: [rx(t), 0, 0], scl: [volume(sy(t)), sy(t), volume(sy(t))] });
  });
  const mushroomFall = () => {
    // 横へばったり倒れる（傘の分だけ持ち上げて地面にめり込まないようにする）
    const rz = K([[0, 0], [0.15, -8], [0.6, 88, "in"], [0.72, 80, "out"], [0.85, 88], [9, 88]]);
    const x = K([[0, 0], [0.6, 0.12], [9, 0.12]]);
    return { rz, x };
  };
  clip("Mushroom", "Death", 1.6, false, [[0.6, "Down"]], () => {
    const { rz, x } = mushroomFall();
    const sy = K([[0, 1], [0.1, 0.85], [0.3, 1.05], [0.6, 1], [0.66, 0.85], [0.8, 1], [1.6, 1]]);
    return (t) => ({ pos: [x(t), 0.3 * sin(rz(t) * DEG), 0], rot: [0, 0, rz(t)], scl: [volume(sy(t)), sy(t), volume(sy(t))] });
  });
  clip("Mushroom", "Death_SporeBurst", 2.3, false, [[0.6, "Down"], [1.6, "SporeBurst"]], () => {
    // 倒れて 1 秒後に膨らんで胞子が弾ける（EN-01）
    const { rz, x } = mushroomFall();
    const swell = K([[0, 1], [0.6, 1], [1.45, 1.12], [1.6, 1.38, "in"], [1.75, 0.5, "out"], [2.3, 0.5]]);
    return (t) => {
      const pulse = t > 0.6 && t < 1.6 ? 0.06 * ((t - 0.6) / 1.0) * Math.abs(sin(TAU * 3 * (t - 0.6))) : 0;
      const s = swell(t) + pulse;
      return { pos: [x(t), 0.3 * sin(rz(t) * DEG) * clamp(s, 0.5, 1.4), 0], rot: [0, 0, rz(t)], scl: [s, s, s] };
    };
  });

  // ---------- ハチ（EN-02 巣守りのバチ） ----------
  clip("Bee", "Idle", 1.2, true, [], () => (t) => ({
    pos: [0, 0.05 * sin(TAU * 2 * t / 1.2), 0],
    rot: [3 * sin(TAU * 2 * t / 1.2 + 1), 0, 4 * sin(TAU * t / 1.2)],
  }));
  clip("Bee", "Move", 1.0, true, [], () => (t) => ({
    pos: [0, 0.04 * sin(TAU * 2 * t), 0],
    rot: [14 + 3 * sin(TAU * 2 * t), 0, 5 * sin(TAU * t)],
  }));
  clip("Bee", "Attack_Sting", 1.2, false, [[0.55, "Hit"]], () => {
    // 引いて機首を上げる（腹が前へ来る）→ 突き刺す → 震えて戻る
    const z = K([[0, 0], [0.4, -0.25], [0.55, 0.9, "in"], [0.7, 0.85], [1.2, 0]]);
    const y = K([[0, 0], [0.4, 0.12], [0.55, -0.1, "in"], [0.7, -0.08], [1.2, 0]]);
    const rx = K([[0, 0], [0.4, -35], [0.55, -50, "in"], [0.7, -45], [1.2, 0]]);
    return (t) => ({ pos: [0, y(t), z(t)], rot: [rx(t), 0, 6 * sin(TAU * 25 * t) * env(t, 0.55, 0.72)] });
  });
  clip("Bee", "Attack_Charge", 1.9, false, [[0.6, "ChargeStart"], [1.5, "ChargeEnd"]], () => {
    // 後ろへ引いて羽音で震える → 前のめりで一直線（移動はゲーム側：秒速9m）→ 急ブレーキ
    const z = K([[0, 0], [0.6, -0.35], [0.7, 0, "in"], [1.9, 0]]);
    const y = K([[0, 0], [0.6, 0.08], [0.7, 0], [1.9, 0]]);
    const rx = K([[0, 0], [0.6, -12], [0.7, 22, "in"], [1.5, 22], [1.65, -22, "out"], [1.9, 0]]);
    const sz = K([[0, 1], [0.6, 0.94], [0.7, 1.15], [1.5, 1.15], [1.65, 0.95], [1.9, 1]]);
    return (t) => ({
      pos: [0, y(t), z(t)],
      rot: [rx(t), 5 * sin(TAU * 18 * t) * env(t, 0, 0.62), 2 * sin(TAU * 20 * t) * env(t, 0.7, 1.5)],
      scl: [1 / Math.sqrt(sz(t)), 1 / Math.sqrt(sz(t)), sz(t)],
    });
  }, { from: 0.7, to: 1.5, dist: 7.2 });
  clip("Bee", "Hit", 0.4, false, [], () => {
    const z = K([[0, 0], [0.07, -0.15, "out"], [0.4, 0]]);
    const rz = K([[0, 0], [0.07, 25, "out"], [0.4, 0]]);
    const rx = K([[0, 0], [0.07, -15], [0.4, 0]]);
    return (t) => ({ pos: [0, 0, z(t)], rot: [rx(t), 0, rz(t)] });
  });
  clip("Bee", "Death", 1.4, false, [[0.9, "Down"]], () => {
    // きりもみで落ちて、地面で横倒しに
    const y = K([[0, 0], [0.9, -0.88, "in"], [1.0, -0.8, "out"], [1.1, -0.88, "in"], [1.4, -0.88]]);
    const ry = K([[0, 0], [0.9, 540], [1.4, 560]]);
    const rz = K([[0, 0], [0.9, 70], [1.4, 90]]);
    return (t) => ({ pos: [0, y(t), 0], rot: [0, ry(t), rz(t)] });
  });

  // ---------- 光の妖精（EN-03 妖精の灯・未作成モデル） ----------
  clip("Fairy", "Idle", 2.4, true, [], () => (t) => ({
    pos: [0.05 * sin(TAU * t / 2.4), 0.08 * sin(TAU * t / 1.2), 0],
    rot: [0, 10 * sin(TAU * t / 2.4), 6 * sin(TAU * t / 2.4 + 0.3)],
  }));
  clip("Fairy", "Move_Flee", 0.8, true, [], () => (t) => ({
    // ジグザグに逃げる
    pos: [0.15 * sin(TAU * t / 0.8), 0.06 * sin(TAU * 2 * t / 0.8), 0],
    rot: [-10, 0, -15 * cos(TAU * t / 0.8)],
  }));
  clip("Fairy", "Attack_Powder", 1.6, false, [[0.7, "Powder"]], () => {
    // 舞い上がってくるくる回り、頂点で眠り粉を撒く
    const y = K([[0, 0], [0.5, 0.3, "out"], [0.9, 0.35], [1.6, 0]]);
    const ry = K([[0, 0], [0.5, 270, "in"], [0.9, 630, "l"], [1.6, 720, "out"]]);
    const s = K([[0, 1], [0.6, 1], [0.7, 1.3, "out"], [0.9, 1.05], [1.6, 1]]);
    return (t) => ({ pos: [0, y(t), 0], rot: [0, ry(t), 0], scl: [s(t), s(t), s(t)] });
  });
  clip("Fairy", "Hit", 0.4, false, [], () => {
    const z = K([[0, 0], [0.08, -0.2, "out"], [0.4, 0]]);
    const s = K([[0, 1], [0.05, 0.75], [0.15, 1.1], [0.4, 1]]);
    return (t) => ({ pos: [0, 0, z(t)], scl: [s(t), s(t), s(t)] });
  });
  clip("Fairy", "Death", 1.2, false, [[1.15, "Vanish"]], () => {
    // らせんを描いて昇りながら消える
    const y = K([[0, 0], [1.2, 0.6, "out"]]);
    const ry = K([[0, 0], [1.2, 720, "in"]]);
    const s = K([[0, 1], [0.2, 1.2], [1.2, 0, "in"]]);
    return (t) => ({ pos: [0.1 * sin(TAU * t / 0.6), y(t), 0.1 * cos(TAU * t / 0.6) - 0.1], rot: [0, ry(t), 0], scl: [s(t), s(t), s(t)] });
  });

  // ---------- 岩ダンゴ（EN-17） ----------
  clip("RockBall", "Idle", 1.6, true, [], () => (t) => {
    const w = sin(TAU * t / 0.8);
    return { rot: [0, 0, 4 * sin(TAU * t / 1.6)], scl: [1 - 0.015 * w, 1 + 0.03 * w, 1 - 0.015 * w] };
  });
  clip("RockBall", "Move", 0.7, true, [], () => (t) => ({
    // よちよち歩き
    pos: [0, 0.04 * (1 - cos(TAU * 2 * t / 0.7)) / 2, 0],
    rot: [5, 0, 8 * sin(TAU * t / 0.7)],
  }));
  clip("RockBall", "Attack_Roll", 2.6, false, [[0.5, "RollStart"], [1.8, "RollEnd"]], () => {

  // Unity の Quaternion.Euler(x, y, z) と同じ（Z → X → Y の順に回す）
  const qMul = (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2],
  ];
  const qAxis = (ax, deg) => { const h = deg * DEG / 2, s = sin(h); return [ax[0] * s, ax[1] * s, ax[2] * s, cos(h)]; };
  const qEuler = (r) => qMul(qMul(qAxis([0, 1, 0], r[1]), qAxis([1, 0, 0], r[0])), qAxis([0, 0, 1], r[2]));
  const qRot = (q, v) => { const r = qMul(qMul(q, [v[0], v[1], v[2], 0]), [-q[0], -q[1], -q[2], q[3]]); return [r[0], r[1], r[2]]; };

  function evalClip(c, t) {
    const s = c.sample(clamp(t, 0, c.dur));
    const pos = s.pos || [0, 0, 0], rot = s.rot || [0, 0, 0], scl = s.scl || [1, 1, 1];
    const q = qEuler(rot);
    const pv = BODIES[c.body].pivot;
    const rs = qRot(q, [pv[0] * scl[0], pv[1] * scl[1], pv[2] * scl[2]]);
    return { pos: [pos[0] + pv[0] - rs[0], pos[1] + pv[1] - rs[1], pos[2] + pv[2] - rs[2]], rot: q, scl };
  }

  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const add3 = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul3 = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm3 = (a) => { const l = Math.hypot(...a) || 1; return mul3(a, 1 / l); };

  const state = {
    playing: true, speed: 1, enemy: 0, clip: "Idle", time: 0, chain: null,
    yaw: 35 * DEG, yawTarget: 35 * DEG, pitch: 0.22, travel: 0,
  };

  let cam = null;
  function setupCamera(E, followZ) {
    const target = [0, 0.55 * E.scale, 0.4 + followZ];
    const dist = 3.2 + 1.3 * E.scale;
    const cp = cos(state.pitch);
    const pos = add3(target, [sin(state.yaw) * cp * dist, sin(state.pitch) * dist, cos(state.yaw) * cp * dist]);
    const F = norm3(sub3(target, pos));
    const R = norm3(cross3([0, 1, 0], F));   // Unity と同じ左手系（正面から見ると +X が画面の左）
    const U = cross3(F, R);
    cam = { pos, F, R, U, f: Math.min(W, H * 1.4) * 0.9, cx: W / 2 + Math.min(150, W * 0.12), cy: H * 0.56 };
  }
  const NEAR = 0.2;
  const toCam = (p) => { const q = sub3(p, cam.pos); return [dot3(q, cam.R), dot3(q, cam.U), dot3(q, cam.F)]; };
  const projC = (c) => ({ x: cam.cx + cam.f * c[0] / c[2], y: cam.cy - cam.f * c[1] / c[2], s: cam.f / c[2], z: c[2] });
  const proj = (p) => { const c = toCam(p); return c[2] > NEAR ? projC(c) : null; };

  function hull(pts) {
    pts = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
    const crs = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length >= 2 && crs(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (const p of pts.slice().reverse()) { while (up.length >= 2 && crs(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }

  function drawGround(E) {
    const rgb = css("--grid");
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, css("--sky-top")); g.addColorStop(1, css("--sky-bottom"));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1;
    const line = (a, b, alpha) => {
      let ca = toCam(a), cb = toCam(b);
      if (ca[2] < NEAR && cb[2] < NEAR) return;
      if (ca[2] < NEAR) ca = add3(ca, mul3(sub3(cb, ca), (NEAR - ca[2]) / (cb[2] - ca[2])));
      else if (cb[2] < NEAR) cb = add3(cb, mul3(sub3(ca, cb), (NEAR - cb[2]) / (ca[2] - cb[2])));
      const p = projC(ca), q = projC(cb);
      ctx.strokeStyle = `rgba(${rgb},${alpha})`;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    };
    for (let x = -20; x <= 20; x++) line([x, 0, -40], [x, 0, 16], x === 0 ? 0.2 : 0.08);
    for (let z = -40; z <= 16; z++) line([-20, 0, z], [20, 0, z], 0.08);
  }

  function drawEnemy(E, T, offsetZ) {
    const scale = E.scale;
    // ルート（敵の本体）→ Motion（クリップ）→ 形
    const toWorld = (p) => {
      const local = add3(qRot(T.rot, [p[0] * T.scl[0], p[1] * T.scl[1], p[2] * T.scl[2]]), T.pos);
      return [local[0] * scale, local[1] * scale, local[2] * scale + offsetZ];
    };
    // 影
    const center = toWorld(BODIES[E.body].pivot);
    const sp = proj([center[0], 0, center[2]]);
    if (sp) {
      const k = clamp(1.2 - center[1] * 0.4, 0.4, 1);
      ctx.fillStyle = `rgba(0,0,0,${0.14 * k})`;
      ctx.beginPath();
      ctx.ellipse(sp.x, sp.y, 0.34 * scale * sp.s * k, 0.34 * scale * sp.s * k * Math.max(0.15, sin(state.pitch) * 1.1), 0, 0, TAU);
      ctx.fill();
    }
    const items = [];
    for (const sh of SHAPES[E.body]) {
      const pts = UNIT.map((u) => proj(toWorld([sh.c[0] + u[0] * sh.r[0], sh.c[1] + u[1] * sh.r[1], sh.c[2] + u[2] * sh.r[2]])));
      if (pts.some((p) => !p)) continue;
      const cc = toCam(toWorld(sh.c));
      items.push({ sh, pts: hull(pts), c: projC(cc), depth: cc[2] });
    }
    items.sort((a, b) => b.depth - a.depth);
    for (const it of items) {
      const col = it.sh.col === "$" ? E.color : it.sh.col;
      if (it.sh.glow) {
        const R = Math.max(4, Math.max(...it.pts.map((p) => Math.hypot(p.x - it.c.x, p.y - it.c.y))));
        const g = ctx.createRadialGradient(it.c.x, it.c.y, 0, it.c.x, it.c.y, R * 3);
        g.addColorStop(0, "rgba(255,255,240,0.9)"); g.addColorStop(0.3, "rgba(253,230,138,0.45)"); g.addColorStop(1, "rgba(253,230,138,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(it.c.x, it.c.y, R * 3, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = it.sh.a || 1;
      ctx.beginPath();
      it.pts.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.closePath();
      ctx.fillStyle = col;
      ctx.fill();
      const R = Math.max(...it.pts.map((p) => Math.hypot(p.x - it.c.x, p.y - it.c.y)));
      const g = ctx.createRadialGradient(it.c.x - R * 0.3, it.c.y - R * 0.35, R * 0.05, it.c.x, it.c.y, R);
      g.addColorStop(0, "rgba(255,255,255,0.35)"); g.addColorStop(0.5, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(0,0,0,0.22)");
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = css("--outline"); ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  // ---------- UI ----------
  const enemySel = document.getElementById("enemy");
  const clipsEl = document.getElementById("clips");
  const descEl = document.getElementById("desc");
  const infoEl = document.getElementById("clipInfo");
  const eventEl = document.getElementById("event");
  const timelineEl = document.getElementById("timeline");
  ENEMIES.forEach((e, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = `${e.id} ${e.name}（${BODIES[e.body].name}）`;
    enemySel.appendChild(o);
  });
  // 待機クリップ（Idle が無ければ名前に Idle を含むもの、それも無ければ最初のクリップ）
  const idleOf = (E) => E.clips.find((n) => n === "Idle") || E.clips.find((n) => n.includes("Idle")) || E.clips[0];
  function selectEnemy(i) {
    state.enemy = i;
    enemySel.value = String(i);
    const E = ENEMIES[i];
    descEl.textContent = E.desc;
    clipsEl.innerHTML = "";
    for (const name of E.clips) {
      const b = document.createElement("button");
      b.textContent = name;
      b.dataset.clip = name;
      b.addEventListener("click", () => { state.chain = null; playClip(name); });
      clipsEl.appendChild(b);
    }
    state.chain = null;
    playClip(idleOf(E));
  }
  function playClip(name) {
    const E = ENEMIES[state.enemy];
    state.clip = name;
    state.time = 0;
    state.travel = 0;
    const c = findClip(E.body, name);
    infoEl.textContent = `${E.body}_${name}：${c.dur}秒・${c.loop ? "ループ" : "1回"}` + (c.events.length ? `・イベント ${c.events.map(([t, n]) => `${n}(${t}s)`).join(" ")}` : "");
    clipsEl.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.clip === name));
  }
  let eventTimer = 0;
  function showEvent(name) { eventEl.textContent = `イベント：${name}`; eventEl.classList.add("show"); eventTimer = 0.6; }
  enemySel.addEventListener("change", () => selectEnemy(+enemySel.value));

  // ---------- ループ ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const E = ENEMIES[state.enemy];
    let c = findClip(E.body, state.clip);
    const prev = state.time;
    if (state.playing) state.time += dt * state.speed;
    for (const [t, n] of c.events) if (prev < t && state.time >= t) showEvent(n);
    if (state.time >= c.dur) {
      if (c.loop && !state.chain) state.time %= c.dur;
      else {
        // 1回きりのクリップは少し止めてから次へ（連続再生中は次のクリップ、それ以外は待機へ）
        if (state.time >= c.dur + (c.name.startsWith("Death") ? 1.2 : 0.35)) {
          if (state.chain) {
            state.chain.i = (state.chain.i + 1) % E.clips.length;
            playClip(E.clips[state.chain.i]);
          } else playClip(idleOf(E));
          c = findClip(E.body, state.clip);
        }
      }
    }
    const t = Math.min(state.time, c.dur);
    // 確認用：突進・転がりの区間だけ前へ動かす（Unity ではゲーム側が動かす）
    let offsetZ = 0;
    if (c.travel) offsetZ = c.travel.dist * clamp((t - c.travel.from) / (c.travel.to - c.travel.from), 0, 1) * (t < c.dur ? 1 : 0);

    let dy = state.yawTarget - state.yaw;
    dy = Math.atan2(sin(dy), cos(dy));
    state.yaw += dy * Math.min(1, dt * 6);
    eventTimer -= dt;
    if (eventTimer <= 0) eventEl.classList.remove("show");
    timelineEl.textContent = `${E.body}_${c.name}  ${t.toFixed(2)} / ${c.dur.toFixed(2)} 秒`;

    setupCamera(E, offsetZ * 0.85);
    drawGround(E);
    drawEnemy(E, evalClip(c, t), offsetZ);
    requestAnimationFrame(frame);
  }

  const playBtn = document.getElementById("play");
  const togglePlay = () => {
    state.playing = !state.playing;
    playBtn.textContent = state.playing ? "一時停止" : "再生";
    playBtn.classList.toggle("on", state.playing);
  };
  playBtn.addEventListener("click", togglePlay);
  window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); togglePlay(); } });
  document.getElementById("all").addEventListener("click", () => {
    state.chain = { i: 0 };
    playClip(ENEMIES[state.enemy].clips[0]);
  });
  document.querySelectorAll("[data-view]").forEach((b) => b.addEventListener("click", () => {
    state.yawTarget = (+b.dataset.view) * DEG;
    document.querySelectorAll("[data-view]").forEach((x) => x.classList.toggle("on", x === b));
  }));
  document.getElementById("speed").addEventListener("input", (e) => { state.speed = +e.target.value; });
  let drag = null;
  canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, yaw: state.yawTarget, pitch: state.pitch }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    state.yawTarget = drag.yaw - (e.clientX - drag.x) * 0.008;
    state.yaw = state.yawTarget;
    state.pitch = clamp(drag.pitch + (e.clientY - drag.y) * 0.004, -0.2, 1.2);
    document.querySelectorAll("[data-view]").forEach((x) => x.classList.remove("on"));
  });
  canvas.addEventListener("pointerup", () => { drag = null; });
  canvas.addEventListener("pointercancel", () => { drag = null; });

  selectEnemy(0);
  requestAnimationFrame(frame);
  window.__dm = { state, ENEMIES, CLIPS, playClip, selectEnemy, evalClip, findClip };
})();
</script>
</body>
</html>
